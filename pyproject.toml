[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workspace-gateway"
version = "0.1.0"
description = "Workspace-first coding gateway with provider-neutral sandbox execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "e2b>=2.13,<2.25",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
workspace-gateway = "workspace_gateway.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
